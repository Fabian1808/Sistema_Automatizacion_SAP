[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-document-automation"
version = "1.0.0"
description = "Automatización de descarga masiva de documentos SAP (HES, OC, Macros)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Fabian", email = "fabian@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pywin32>=306",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.0",
    "pre-commit>=3.6",
]
build = [
    "pyinstaller>=6.8",
]

[project.urls]
Homepage = "https://github.com/Fabian1808/Sistema_Automatizacion_SAP"
Repository = "https://github.com/Fabian1808/Sistema_Automatizacion_SAP"
Issues = "https://github.com/Fabian1808/Sistema_Automatizacion_SAP/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sap_document_automation*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "W", "N", "SIM", "RSE", "RET", "PTH"]
ignore = ["E501", "SIM103", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
"src/sap_document_automation/__main__.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "requires_sap: Requires SAP GUI running",
]

[tool.coverage.run]
source = ["src/sap_document_automation"]
omit = ["tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]